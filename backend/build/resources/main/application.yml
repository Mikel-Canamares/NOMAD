spring:
  application:
    name: nomad-backend

  cache:
    type: caffeine
    cache-names: poiCache, askCache
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

server:
  port: 8081
  tomcat:
    connection-timeout: 20s
    threads:
      max: 200
      min-spare: 10
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
