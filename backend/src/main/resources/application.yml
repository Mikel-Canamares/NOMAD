spring:
  application:
    name: nomad-backend

  cache:
    type: caffeine
    cache-names: poiCache, askCache
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30m

server:
  port: 8081
  tomcat:
    connection-timeout: 20s
    threads:
      max: 200
      min-spare: 10
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.nomad.service.OverpassService: DEBUG
    com.nomad.service.AskService: INFO
    com.nomad.service.aggregator: INFO

# API Keys (use environment variables or external config in production)
api:
  openai:
    key: ${OPENAI_API_KEY:PLACEHOLDER_OPENAI_KEY}
  opentripmap:
    key: ${OPENTRIPMAP_API_KEY:PLACEHOLDER_OPENTRIPMAP_KEY}
  foursquare:
    key: ${FOURSQUARE_API_KEY:PLACEHOLDER_FOURSQUARE_KEY}
  google:
    places:
      key: ${GOOGLE_PLACES_API_KEY:PLACEHOLDER_GOOGLE_KEY}
